name: Capsule Online checks
on:
  push:
    branches: [main]
    paths:
      - 'capsule-online.js'
      - 'tests/capsule-online-ux.test.cjs'
      - '.github/workflows/capsule-online-check.yml'
  pull_request:
    paths:
      - 'capsule-online.js'
      - 'tests/capsule-online-ux.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capsule-online:
    name: Skaz adapter syntax and behavioral tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check capsule-online.js && node --check tests/capsule-online-ux.test.cjs
      # Historical tests/capsule-online-v025.test.cjs targets obsolete 0.25
      # internals. Keep it in the repo for migration reference, not CI gating.
      - name: Current voice routing, catalog coverage and UI regressions
        run: node --test tests/capsule-online-ux.test.cjs
