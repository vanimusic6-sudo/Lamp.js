name: Capsule Online checks
on:
  push:
    branches: [main]
    paths:
      - 'capsule-online.js'
      - 'tests/capsule-online-v030.test.cjs'
      - '.github/workflows/capsule-online-check.yml'
  pull_request:
    paths:
      - 'capsule-online.js'
      - 'tests/capsule-online-v030.test.cjs'
      - '.github/workflows/capsule-online-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capsule-online:
    name: Capsule Online 0.30 syntax, behavior and security
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check capsule-online.js && node --check tests/capsule-online-v030.test.cjs
      - name: Provider, playlist and security regressions
        run: node --test tests/capsule-online-v030.test.cjs
