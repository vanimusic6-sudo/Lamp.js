name: Amedia plugin checks
on:
  push:
    branches:
      - main
      - 'feature/amedia-**'
      - 'fix/amedia-*'
    paths:
      - amedia-android.js
      - tests/amedia-client.test.cjs
      - tests/amedia-v5.test.cjs
      - .github/workflows/amedia-check.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amedia-smoke:
    name: Syntax and controller smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check amedia-android.js
      - name: Verify Skaz-core, native hub, fresh per-episode handoff, controls and Android completion
        run: node --test tests/amedia-v5.test.cjs
