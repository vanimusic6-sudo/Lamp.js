name: Skaz Online Auto checks
on:
  push:
    branches:
      - main
      - 'feature/skaz-*'
      - 'fix/skaz-*'
    paths:
      - skaz-online-auto.js
      - tests/skaz-online-auto.test.cjs
      - .github/workflows/skaz-online-check.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skaz-smoke:
    name: Syntax and selection/playlist regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify original plugin syntax
        run: node --check skaz-online-auto.js
      - name: Verify auto source, voice, quality, next and resume
        run: node --test tests/skaz-online-auto.test.cjs
